services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: apisungku
      POSTGRES_PASSWORD: apisungku
      POSTGRES_DB: apisungku
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U apisungku']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://apisungku:apisungku@db:5432/apisungku?schema=public
    ports:
      - '3000:3000'

volumes:
  db_data:
