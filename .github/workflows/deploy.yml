name: Build et deploiement

# preprod -> environnement de preproduction f
# main    -> production
on:
  push:
    branches: [main, preprod]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ─── 1. Verification ──────────────────────────────────────────────────────
  verifier:
    name: Compilation et tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run build
      - run: npm test

  # ─── 2. Image ─────────────────────────────────────────────────────────────
  build:
    name: Construire et publier l'image
    runs-on: ubuntu-latest
    # Une image n'est jamais publiee sur du code qui ne compile pas.
    needs: verifier
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Authentification au registre GitHub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # Fourni automatiquement par Actions : aucun secret a creer ici.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Calculer les tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ github.run_number }}
            type=ref,event=branch
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Construire et pousser
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── 3. Deploiement ───────────────────────────────────────────────────────
  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: >-
      github.event_name == 'push' && 
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/preprod')
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'preproduction' }}

    steps:
      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e

            echo "Connected to server"
            whoami
            hostname
            pwd
            cd "${{ secrets.DEPLOY_PATH }}"

            echo "Login to GHCR"
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_USERNAME }}" --password-stdin

            echo "Set image tag (APISUNGKU_TAG=${{ github.run_number }})"
            # Le .env du serveur existe deja et porte les secrets applicatifs
            # (DATABASE_URL, PAWAPAY_API_TOKEN, API_KEY_SALT). On n'y touche
            # que pour la ligne du tag : le reste ne doit jamais etre ecrase
            # par le pipeline.
            if grep -q '^APISUNGKU_TAG=' .env; then
              sed -i 's/^APISUNGKU_TAG=.*/APISUNGKU_TAG=${{ github.run_number }}/' .env
            else
              echo 'APISUNGKU_TAG=${{ github.run_number }}' >> .env
            fi

            echo "Pull latest images"
            docker compose pull

            echo "Recreate containers"
            # --remove-orphans a ete retire volontairement : il supprime tout
            # conteneur du projet non declare dans docker-compose.yml. Si la
            # base a ete demarree autrement, le deploiement la detruirait, et
            # l'application se retrouverait sans base sans explication.
            docker compose up -d --force-recreate

            echo "Remove unused images"
            docker image prune -af

            # Un `docker compose up -d` rend la main des que le conteneur est
            # cree, meme s'il redemarre en boucle juste apres. Sans cette
            # verification, un deploiement casse passe au vert et personne ne
            # s'en apercoit avant de recevoir un 502.
            #
            # La sonde est locale au serveur : elle ne depend ni d'une URL
            # publique, ni du reverse proxy, ni d'une variable a configurer.
            echo "Verifie que le service repond"
            SERVICE=$(docker compose ps --services | grep -i 'api\|sungku' | head -1)
            SERVICE=${SERVICE:-api}

            for i in $(seq 1 20); do
              if docker compose exec -T "$SERVICE" \
                   node -e "fetch('http://127.0.0.1:3000/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))" \
                   2>/dev/null; then
                echo "Service operationnel apres ${i} tentative(s)."
                echo "Deployment finished"
                exit 0
              fi
              echo "Tentative $i : pas encore pret."
              sleep 5
            done

            echo "ECHEC : le service ne repond pas apres 100 secondes."
            echo "----- etat des conteneurs -----"
            docker compose ps
            echo "----- 80 dernieres lignes de journal -----"
            docker compose logs --tail=80 "$SERVICE"
            exit 1

      # - name: Verifier que le service repond
      #   # Un deploiement qui ne repond pas doit faire echouer le job, pas
      #   # passer inapercu.
      #   run: |
      #     for i in $(seq 1 10); do
      #       if curl -fsS "${{ vars.HEALTHCHECK_URL }}" > /dev/null; then
      #         echo "Service operationnel."
      #         exit 0
      #       fi
      #       echo "Tentative $i : pas encore pret."
      #       sleep 10
      #     done
      #     echo "Le service ne repond pas apres deploiement."
      #     exit 1

# ─────────────────────────────────────────────────────────────────────────────
# A definir dans Settings > Secrets and variables > Actions :
#
#   Secrets  : SERVER_HOST, SERVER_USER, SERVER_SSH_KEY, DEPLOY_PATH,
#              GHCR_USERNAME, GHCR_TOKEN
#   Variables: HEALTHCHECK_URL   (ex. https://api.sungku.cm/v1/health)
#
# GHCR_TOKEN est un token personnel avec la portee read:packages : il sert au
# serveur a tirer l'image. Le GITHUB_TOKEN du job de build, lui, est fourni
# automatiquement.
#
# Les secrets applicatifs (DATABASE_URL, PAWAPAY_API_TOKEN, API_KEY_SALT) ne
# passent jamais par GitHub : ils vivent dans le .env du serveur.
# ─────────────────────────────────────────────────────────────────────────────
