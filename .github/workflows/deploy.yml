name: Build et deploiement

# preprod -> environnement de preproduction
# main    -> production
on:
  push:
    branches: [main, preprod]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ─── 1. Verification ──────────────────────────────────────────────────────
  verifier:
    name: Compilation et tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run build
      - run: npm test

  # ─── 2. Image ─────────────────────────────────────────────────────────────
  image:
    name: Construire et publier l'image
    runs-on: ubuntu-latest
    # Une image n'est jamais publiee sur du code qui ne compile pas.
    needs: verifier
    permissions:
      contents: read
      packages: write

    outputs:
      digest: ${{ steps.build.outputs.digest }}
      tags: ${{ steps.meta.outputs.tags }}

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Authentification au registre GitHub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # Fourni automatiquement par Actions : aucun secret a creer.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Calculer les tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Construire et pousser
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Le cache du registre evite de reinstaller node_modules a chaque fois.
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── 3. Deploiement ───────────────────────────────────────────────────────
  # A ADAPTER a l'hebergement retenu. Le squelette ci-dessous suppose un VPS
  # joignable en SSH ; voir les variantes en commentaire en fin de fichier.
  deployer:
    name: Deployer
    runs-on: ubuntu-latest
    needs: image
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'preproduction' }}

    steps:
      - name: Deployer sur le serveur
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd ${{ vars.DEPLOY_PATH || '/opt/apisungku' }}

            echo "${{ secrets.GITHUB_TOKEN }}" \
              | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            docker compose pull api
            # Les migrations Prisma sont appliquees au demarrage du conteneur
            # (voir CMD du Dockerfile) : le schema ne reste jamais en retard.
            docker compose up -d --no-deps api
            docker image prune -f

      - name: Verifier que le service repond
        run: |
          for i in $(seq 1 10); do
            if curl -fsS "${{ vars.HEALTHCHECK_URL }}" > /dev/null; then
              echo "Service operationnel."
              exit 0
            fi
            echo "Tentative $i : pas encore pret."
            sleep 10
          done
          echo "Le service ne repond pas apres deploiement."
          exit 1

# ─────────────────────────────────────────────────────────────────────────────
# Secrets et variables a definir dans Settings > Secrets and variables :
#
#   Secrets : DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY
#   Variables : DEPLOY_PATH, HEALTHCHECK_URL
#
# Le token du registre (GITHUB_TOKEN) est fourni automatiquement.
#
# Variantes selon l'hebergement finalement retenu :
#
#   Railway  : remplacer le job par `railway up --service apisungku`
#              avec RAILWAY_TOKEN en secret.
#   Render   : un simple appel curl sur le Deploy Hook suffit ;
#              le job `image` devient meme inutile (Render construit lui-meme).
#   Fly.io   : `flyctl deploy --image <tag>` avec FLY_API_TOKEN en secret.
# ─────────────────────────────────────────────────────────────────────────────
